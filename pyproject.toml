[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kransx"
version = "0.1.0"
description = "KRANSX authenticated encryption-envelope reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KRANSX contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Archiving :: Compression",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
keywords = ["aead", "compression", "encryption", "zstandard"]
dependencies = ["cryptography>=42", "zstandard>=0.22"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pre-commit>=4", "pytest>=7", "ruff>=0.4"]

[project.scripts]
kransx = "kransx.cli:main"

[project.urls]
Issues = "https://forge.int.tsunyanapat.com/tsun/KRANSX/issues"
Source = "https://forge.int.tsunyanapat.com/tsun/KRANSX"

[tool.setuptools.packages.find]
include = ["kransx"]

[tool.setuptools.package-data]
kransx = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
